<style>
:root{--ok:#2f7d4f;--bg:#faf8f5;--card:#fff;--text:#1d1b19;--muted:#6f6a64;--line:#e6e1da;--accent:#b4462f;--accent-soft:#f6e3dd;--star:#d99a00}
@media (prefers-color-scheme:dark){:root{--ok:#4fae75;--bg:#171615;--card:#211f1d;--text:#eeeae5;--muted:#a19b94;--line:#35322e;--accent:#e57a5f;--accent-soft:#3a2620;--star:#f2b81c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 10px;font-size:15px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--text);border-color:var(--accent)}
main{padding:0 16px 60px}
h2{font-size:18px;margin:26px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--accent)}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
.ev{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}

.ev.short{padding:6px 12px}
.star{flex:none;width:32px;height:32px;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0}
.ev.sel .star{color:var(--star)}
.body{min-width:0;flex:1}
.t{font-weight:600}
.t a{color:inherit;text-decoration:none}
.t a:hover{text-decoration:underline}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin-right:6px}
.meta{color:var(--muted);font-size:13px}
.sum{font-size:14px;margin-top:3px}
.links a{font-size:13px;color:var(--accent);margin-right:12px}
.gone{font-size:12px;color:var(--accent)}
.empty{color:var(--muted);padding:30px 0;text-align:center}

.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--accent)}
@media (max-width:600px){h1{font-size:16px}.sub{font-size:12px;margin-bottom:8px}.tab{padding:5px 12px}}
.ev[draggable=true]{cursor:grab}
.ev.dragging{opacity:.4}
.mv{font-size:13px;color:var(--muted);margin-top:4px}
.mv select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.month{border-radius:10px;padding:0 6px 4px;margin:0 -6px}
.month.ok{outline:2px dashed var(--line)}
.month.over{outline:2px dashed var(--accent);background:var(--accent-soft)}
.month.no{opacity:.35}
.warn{font-size:12px;color:var(--accent);margin-top:3px}
.balance{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
body.sel-tab .sub{display:none}
.balance:empty{display:none}
.bal{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;padding:2px 7px;font-size:13px;cursor:pointer}
.bal b{font-size:14px;margin-left:3px}
.bal.zero{color:var(--muted);opacity:.6}
.n{color:var(--muted);font-weight:normal;font-size:15px}
#out.compact .sum,#out.compact .links{display:none}
#out.compact .mv{display:inline;margin:0 0 0 6px}
#out.compact .ev{padding:5px 10px;margin:4px 0;align-items:center}
#out.compact .star{width:26px;height:26px;font-size:18px}
#out.compact .t{display:inline;font-size:15px}
#out.compact .meta{display:inline;margin-left:6px}
.keep{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:2px 10px;margin-top:6px;cursor:pointer}
.keep.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ev.final{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
#out.compact .keep{margin:0 0 0 6px}
.tix{font-size:13px;border:1px solid transparent;background:none;border-radius:999px;padding:2px 8px;margin:6px 0 0 4px;cursor:pointer;filter:grayscale(1);opacity:.6}
.tix.on{filter:none;opacity:1;border-color:var(--star);background:var(--accent-soft);color:var(--text)}
#out.compact .tix{margin:0 0 0 2px}
.balance .seg{margin:0 6px 0 0}
.balance .seg button{padding:2px 9px;font-size:13px}
.seg{display:flex;gap:0;margin:0 0 6px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;font-size:14px;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:none}
.seg button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bal.full{border-color:var(--ok)}
.drop{color:var(--muted);font-size:14px;padding:12px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'programme-culturel-selection-v1';
let sel = {};
try { sel = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
// refresh stored copies with this week's details
// (keeping the month it was starred in)
for (const id in sel) if (D.events[id]) sel[id] = {...D.events[id], month: sel[id].month, final: sel[id].final, bought: sel[id].bought};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(sel)); } catch (e) {} };
// "Lien vers un autre appareil": #s= then 9 characters per pick, a 6-character
// code for the event (hash of its id, stable from week to week), its month
// (2 base-36 characters, months since 2020) and 1 if it is "retenu".
// Older links (#sel=, JSON) are still read.
const code = id => {
  let h = 2166136261;
  for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619);
  return ((h >>> 0) % 2176782336).toString(36).padStart(6, '0');
};
const monthCode = k => ((+k.slice(0, 4) - 2020) * 12 + +k.slice(5) - 1).toString(36).padStart(2, '0');
const codeMonth = c => { const n = parseInt(c, 36); return `${2020 + Math.floor(n / 12)}-${String(n % 12 + 1).padStart(2, '0')}`; };
let imported = 0;
const addPick = (id, month, final, bought = false) => {
  if (D.events[id] && !sel[id]) { sel[id] = {...D.events[id], month, final: !!final, bought}; imported++; }
};
// link: a whole shared link or just its "#…" part (also pasted by hand, see "Importer")
function importLink(link) {
  const i = link.indexOf('#'), hash = i < 0 ? '' : link.slice(i);
  try {
    if (hash.startsWith('#sel=')) {
      for (const [id, month, final] of JSON.parse(decodeURIComponent(hash.slice(5)))) addPick(id, month, final);
    } else if (hash.startsWith('#s=')) {
      const byCode = {};
      for (const id in D.events) byCode[code(id)] = id;
      // last character: 1 = retenu, + 2 = billet acheté
      for (const m of hash.slice(3).matchAll(/([0-9a-z]{6})([0-9a-z]{2})([0-3])/g))
        if (byCode[m[1]]) addPick(byCode[m[1]], codeMonth(m[2]), +m[3] & 1, !!(+m[3] & 2));
    }
  } catch (e) {}
}
importLink(location.hash);
if (location.hash.startsWith('#s')) history.replaceState(null, '', location.pathname);
save();

let tab = 'all', q = '', types = new Set();
const scrollPos = {};
// "Retenus": the final cut, at most MAX_FINAL per month (≈ 3 shows a week)
const MAX_FINAL = 12;
let finalOnly = false;
let compact = false;  // "Ma sélection" one line per pick; remembered per browser
try { compact = localStorage.getItem('programme-culturel-compact') === '1'; } catch (e) {}
try { finalOnly = localStorage.getItem('programme-culturel-final-only') === '1'; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const date = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}`; };
const longDate = iso => { const x = new Date(iso + 'T12:00'); return x.toLocaleDateString('fr-FR', {weekday: 'short', day: 'numeric', month: 'short'}); };
const when = e => e.start === e.end ? longDate(e.start) : `du ${date(e.start)} au ${date(e.end)}`;

function matches(e) {
  if (types.size && !types.has(e.type)) return false;
  return !q || norm(`${e.title} ${e.venue} ${e.summary}`).includes(q);
}

function card(id, e, short, month) {
  const on = !!sel[id];
  const title = e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title);
  let h = `<div class="ev${on ? ' sel' : ''}${short ? ' short' : ''}" data-id="${esc(id)}" data-month="${month || ''}">
    <button class="star" title="${on ? 'Retirer de' : 'Ajouter à'} ma sélection">${on ? '★' : '☆'}</button>
    <div class="body"><div class="t"><span class="tag">${esc(e.type)}</span>${title}</div>
    <div class="meta">${esc(e.venue)} · ${short ? `jusqu'au ${date(e.end)}` : when(e)}</div>`;
  if (!short) {
    if (e.summary) h += `<div class="sum">${esc(e.summary)}</div>`;
    if (e.ticket) h += `<div class="links"><a href="${esc(e.ticket)}" target="_blank" rel="noopener">Billets</a></div>`;
  }
  if (tab === 'sel' && !D.events[id]) h += `<div class="gone">Plus au programme cette semaine</div>`;
  if (tab === 'sel') {
    const twins = twinMonths(id, e);
    const here = twins.includes(monthOf(e)), elsewhere = twins.filter(k => k !== monthOf(e)).map(k => monthName(k).toLowerCase());
    if (elsewhere.length) h += `<div class="warn">⚠ Ce spectacle est aussi dans votre sélection en ${elsewhere.join(', ')}</div>`;
    if (here) h += `<div class="warn">⚠ Ce spectacle est sélectionné deux fois ce mois-ci</div>`;
  }
  if (tab === 'sel') h += `<button class="keep${e.final ? ' on' : ''}">${e.final ? '✓ Retenu' : 'Retenir'}</button>`
    + `<button class="tix${e.bought ? ' on' : ''}" title="${e.bought ? 'Billet acheté (toucher pour annuler)' : 'Marquer le billet comme acheté'}">`
    + `🎟${e.bought ? ' Acheté' : ''}</button>`;
  if (tab === 'sel' && validMonths(e).length > 1)
    h += `<div class="mv">Mois : <select>${validMonths(e).map(k =>
      `<option value="${k}"${k === monthOf(e) ? ' selected' : ''}>${monthName(k)}</option>`).join('')}</select></div>`;
  h += '</div></div>';
  if (tab === 'sel' && e.final) h = h.replace('<div class="ev sel', '<div class="ev sel final');
  return tab === 'sel' && validMonths(e).length > 1 ? h.replace('<div class="ev', '<div draggable="true" class="ev') : h;
}

function renderAll() {
  let h = '';
  for (const m of D.months) {
    let mh = '';
    for (const s of m.sections) {
      const ids = s.ids.filter(id => matches(D.events[id]));
      if (ids.length) mh += `<h3>${esc(s.title)}</h3>` + ids.map(id => card(id, D.events[id], s.reminder, m.key)).join('');
    }
    if (mh) h += `<h2>${esc(m.title)}</h2>` + mh;
  }
  return h || '<div class="empty">Aucun événement ne correspond.</div>';
}

const SHORT_MONTHS = ['', 'janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const monthName = k => `${D.monthNames[+k.slice(5)]} ${k.slice(0, 4)}`;
// the programme's months (today's month → end of season) an event runs in
const validMonths = e => D.months.map(m => m.key).filter(k => k >= e.start.slice(0, 7) && k <= e.end.slice(0, 7));
// the month it was starred in or moved to, if still valid; else the first it runs in
function monthOf(e) {
  const ok = validMonths(e);
  if (ok.includes(e.month)) return e.month;
  return ok[0] || (e.start > new Date().toISOString().slice(0, 10) ? e.start.slice(0, 7) : D.months[0].key);
}

const boughtIn = k => Object.values(sel).filter(e => e.bought && (!finalOnly || e.final) && monthOf(e) === k).length;
const finalsIn = k => Object.values(sel).filter(e => e.final && monthOf(e) === k).length;

function grouped(onlyFinal = false) {
  const groups = {};
  for (const [id, e] of Object.entries(sel)) if (!onlyFinal || e.final) (groups[monthOf(e)] ||= []).push([id, e]);
  return Object.keys(groups).sort().map(k =>
    [monthName(k), groups[k].sort((a, b) => (a[1].start + a[1].title).localeCompare(b[1].start + b[1].title)), k]);
}

// same show picked twice: same title and type at another venue (a tour, a run moving on).
// At a single venue a repeated title is a series of different programmes
// ("Orchestre de Paris / …", "Une heure avec"), the same show would share its URL.
const showKey = e => norm(e.title).replace(/[^a-z0-9]+/g, ' ').trim();
function twinMonths(id, e) {
  const months = Object.entries(sel)
    .filter(([other, o]) => other !== id && showKey(o) === showKey(e) && o.type === e.type && o.venue !== e.venue)
    .map(([, o]) => monthOf(o));
  return [...new Set(months)].sort();
}

function moveTo(id, k) {
  if (!sel[id] || !validMonths(sel[id]).includes(k)) return;
  if (sel[id].final && monthOf(sel[id]) !== k && finalsIn(k) >= MAX_FINAL) {
    render(); return toast(`Déjà ${MAX_FINAL} retenus en ${monthName(k).toLowerCase()}`);
  }
  sel[id].month = k; save(); render();
  toast(`Déplacé en ${monthName(k).toLowerCase()}`);
}

function renderSel() {
  if (!Object.keys(sel).length) return `<div class="empty">Touchez ☆ sur un événement pour l'ajouter ici.<br><br>
    Votre sélection est sur un autre appareil ou dans Safari ?
    <button class="btn alt" data-act="import">Importer un lien</button></div>`;
  const g = grouped(finalOnly), nFinal = Object.values(sel).filter(e => e.final).length;
  let h = `<div class="actions">
    <button class="btn" data-act="copy">Copier pour WhatsApp</button>
    <button class="btn alt" data-act="txt">Télécharger (.txt)</button>
    <button class="btn alt" data-act="doc">Télécharger (Word)</button>
    <button class="btn alt" data-act="link">Lien vers un autre appareil</button>
    <button class="btn alt" data-act="import">Importer un lien</button>
    <button class="btn alt" data-act="compact">${compact ? 'Vue détaillée' : 'Vue compacte'}</button>
    <button class="btn alt" data-act="clear">Tout effacer</button></div>`;
  if (finalOnly && !nFinal) h += `<div class="empty">Touchez « Retenir » sur vos favoris (${MAX_FINAL} au plus par mois) : seuls ceux-là s'afficheront ici, et seront exportés.</div>`;
  for (const [month, items, k] of g) {
    const shown = items.filter(([, e]) => matches(e));
    if (shown.length) h += `<section class="month" data-key="${k}"><h2>${esc(month)} <span class="n">· ${items.length}`
      + ` · ✓ ${finalsIn(k)}/${MAX_FINAL}${boughtIn(k) ? ` · 🎟 ${boughtIn(k)}` : ''}</span></h2>`
      + shown.map(([id, e]) => card(id, e, false)).join('') + '</section>';
  }
  return h;
}

function render() {
  $('#count').textContent = Object.keys(sel).length;
  $('#out').innerHTML = tab === 'all' ? renderAll() : renderSel();
  $('#out').classList.toggle('compact', tab === 'sel' && compact);
  document.body.classList.toggle('sel-tab', tab === 'sel');
  // picks per month over the season, in the sticky header so it stays in view (tap: jump there)
  const n = {};
  for (const e of Object.values(sel)) if (!finalOnly || e.final) n[monthOf(e)] = (n[monthOf(e)] || 0) + 1;
  // in "Retenus" each month reads n/12; the Tout / Retenus switch sits in front, also always in view
  const nFinal = Object.values(sel).filter(e => e.final).length;
  $('#balance').innerHTML = tab === 'sel' && Object.keys(sel).length ?
    `<div class="seg"><button data-act="all-picks" class="${finalOnly ? '' : 'on'}">Tout (${Object.keys(sel).length})</button>`
    + `<button data-act="final-only" class="${finalOnly ? 'on' : ''}">Retenus (${nFinal})</button></div>` + D.months.map(m =>
    `<button class="bal${n[m.key] ? '' : ' zero'}${finalOnly && n[m.key] >= MAX_FINAL ? ' full' : ''}" data-jump="${m.key}">`
    + `${SHORT_MONTHS[+m.key.slice(5)]}<b>${n[m.key] || 0}${finalOnly ? '/' + MAX_FINAL : ''}</b></button>`).join('') : '';
}

function exportText() {
  let t = `*Ma sélection culturelle${finalOnly ? ' (finale)' : ''}*\n`;
  for (const [month, items] of grouped(finalOnly)) {
    t += `\n*${month}*\n`;
    for (const [, e] of items) {
      t += `• ${e.title} (${e.type.toLowerCase()}) : ${e.venue}, ${when(e)}${e.bought ? ' 🎟 billet pris' : ''}\n`;
      if (e.ticket || e.url) t += `  ${e.ticket || e.url}\n`;
    }
  }
  return t;
}

function exportDoc() {
  let b = `<h1>Ma sélection culturelle${finalOnly ? ' (finale)' : ''}</h1>`;
  for (const [month, items] of grouped(finalOnly)) {
    b += `<h2>${esc(month)}</h2><ul>`;
    for (const [, e] of items) {
      const link = e.ticket || e.url;
      b += `<li><b>${esc(e.title)}</b> (${esc(e.type.toLowerCase())}) : ${esc(e.venue)}, ${esc(when(e))}${e.bought ? ' 🎟 billet pris' : ''}`
        + (e.summary ? `<br>${esc(e.summary)}` : '') + (link ? `<br><a href="${esc(link)}">${esc(link)}</a>` : '') + '</li>';
    }
    b += '</ul>';
  }
  return `<html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial,sans-serif">${b}</body></html>`;
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + text], {type}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// html: also put a rich-text version on the clipboard (a clickable "Sélection culturelle"
// in Mail, Notes, Gmail...); apps that only take plain text (WhatsApp) get `text`
async function copy(text, msg = 'Copié : collez dans WhatsApp', html = null) {
  try {
    if (html && window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type: 'text/html'}), 'text/plain': new Blob([text], {type: 'text/plain'})})]);
    else await navigator.clipboard.writeText(text);
  }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(msg);
}

$('#chips').innerHTML = D.types.filter(t => Object.values(D.events).some(e => e.type === t))
  .map(t => `<button class="chip" data-type="${esc(t)}">${esc(t)}</button>`).join(' ');

document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.classList.contains('star')) {
    const card = b.closest('.ev'), id = card.dataset.id;
    if (sel[id]) delete sel[id]; else sel[id] = {...D.events[id], month: card.dataset.month};
    save();
    const y = window.scrollY; render(); window.scrollTo(0, y);
  } else if (b.dataset.tab) {
    scrollPos[tab] = window.scrollY;  // each tab comes back where it was left
    tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    render(); window.scrollTo(0, scrollPos[tab] || 0);
  } else if (b.dataset.type) {
    const t = b.dataset.type;
    types.has(t) ? types.delete(t) : types.add(t);
    b.classList.toggle('on'); render();
  } else if (b.dataset.act === 'copy') copy(exportText());
  else if (b.dataset.act === 'txt') download('ma-selection.txt', exportText(), 'text/plain;charset=utf-8');
  else if (b.dataset.act === 'doc') download('ma-selection.doc', exportDoc(), 'application/msword');
  else if (b.dataset.act === 'link') {
    const picks = Object.entries(sel).filter(([id]) => D.events[id])
      .map(([id, e]) => code(id) + monthCode(monthOf(e)) + ((e.final ? 1 : 0) + (e.bought ? 2 : 0))).join('');
    const url = location.origin + location.pathname + '#s=' + picks;
    copy(url, 'Lien « Sélection culturelle » copié', `<a href="${esc(url)}">Sélection culturelle</a>`);
  }
  else if (b.classList.contains('keep')) {
    const e = sel[b.closest('.ev').dataset.id];
    if (!e.final && finalsIn(monthOf(e)) >= MAX_FINAL)
      return toast(`Déjà ${MAX_FINAL} retenus en ${monthName(monthOf(e)).toLowerCase()} : retirez-en un d'abord`);
    e.final = !e.final; save();
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  else if (b.classList.contains('tix')) {
    const e = sel[b.closest('.ev').dataset.id];
    e.bought = !e.bought; save();
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  else if (b.dataset.act === 'all-picks' || b.dataset.act === 'final-only') {
    finalOnly = b.dataset.act === 'final-only';
    try { localStorage.setItem('programme-culturel-final-only', finalOnly ? '1' : '0'); } catch (e) {}
    render();
  }
  else if (b.dataset.act === 'import') {
    // an iPhone home-screen icon has its own storage, apart from Safari, and links
    // always open in Safari: pasting the link here is how picks get into it
    const link = prompt('Collez ici le lien copié avec « Lien vers un autre appareil » :');
    if (!link) return;
    imported = 0; importLink(link.trim()); save(); render();
    toast(imported ? `${imported} événement(s) ajouté(s) à votre sélection` : 'Aucun nouvel événement dans ce lien');
  }
  else if (b.dataset.act === 'compact') {
    compact = !compact; try { localStorage.setItem('programme-culturel-compact', compact ? '1' : '0'); } catch (e) {}
    render();
  }
  else if (b.dataset.jump) {
    const m = document.querySelector(`.month[data-key="${b.dataset.jump}"]`);
    if (m) window.scrollTo(0, m.getBoundingClientRect().top + window.scrollY - $('header').offsetHeight - 8);
  }
  else if (b.dataset.act === 'clear' && confirm('Effacer toute la sélection ?')) { sel = {}; save(); render(); }
});
// "Ma sélection": drag a card to another month it runs in (or use its "Mois" menu).
// While dragging, months it does not run in are dimmed and refuse the drop;
// valid months with no pick yet get an empty drop zone.
let dragId = null;
document.addEventListener('dragstart', ev => {
  const c = ev.target.closest && ev.target.closest('.ev[draggable]'); if (!c) return;
  dragId = c.dataset.id; c.classList.add('dragging');
  ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', dragId);
  const ok = validMonths(sel[dragId]);
  const out = $('#out');
  for (const k of ok) if (!out.querySelector(`.month[data-key="${k}"]`)) {
    const z = document.createElement('section');
    z.className = 'month'; z.dataset.key = k;
    z.innerHTML = `<h2>${esc(monthName(k))}</h2><div class="drop">Déposer ici</div>`;
    const next = [...out.querySelectorAll('.month')].find(x => x.dataset.key > k);
    next ? out.insertBefore(z, next) : out.appendChild(z);
  }
  out.querySelectorAll('.month').forEach(x => x.classList.add(ok.includes(x.dataset.key) ? 'ok' : 'no'));
});
document.addEventListener('dragover', ev => {
  const m = dragId && ev.target.closest('.month');
  document.querySelectorAll('.month.over').forEach(x => x !== m && x.classList.remove('over'));
  if (m && m.classList.contains('ok')) { ev.preventDefault(); m.classList.add('over'); }
});
document.addEventListener('drop', ev => {
  const m = dragId && ev.target.closest('.month.ok'); if (!m) return;
  ev.preventDefault(); const id = dragId; dragId = null; moveTo(id, m.dataset.key);
});
document.addEventListener('dragend', () => { if (dragId) { dragId = null; render(); } });
document.addEventListener('change', ev => {
  if (ev.target.closest('.mv')) moveTo(ev.target.closest('.ev').dataset.id, ev.target.value);
});
$('#q').addEventListener('input', ev => { q = norm(ev.target.value.trim()); render(); });
render();
if (imported) toast(`${imported} événement(s) ajouté(s) à votre sélection`);
</script>
</body>
</html>
